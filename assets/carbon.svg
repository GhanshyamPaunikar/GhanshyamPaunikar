<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1a14"/><stop offset="1" stop-color="#122a1f"/></linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.5" r="0.45"><stop offset="0" stop-color="#4ade80" stop-opacity="0.28"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
<style>
.in{opacity:0;animation:fade 1s ease-out forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}
