<circle r="8" fill="#4ade80"><animateMotion dur="4s" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear" repeatCount="indefinite" path="M0 190 L45 170 L90 178 L135 130 L180 140 L225 95 L270 105 L315 60 L360 40"/></circle>
<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8fb39d"><text x="0" y="236">kWh</text><text x="150" y="236">gCO₂e</text><text x="310" y="236">$ cost</text></g>
