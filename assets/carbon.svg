</style>
</defs>
<rect width="1200" height="400" rx="18" fill="url(#bg)"/>
<rect width="1200" height="400" rx="18" fill="url(#glow)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text class="in" x="80" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="4" fill="#8fb39d">OPEN SOURCE · PYTHON CLI</text>
<text class="in d1" x="76" y="205" font-size="62" font-weight="300" letter-spacing="-2" fill="#eaf6ee">Carbon Watcher</text>
<text class="in d2" x="80" y="262" font-size="27" font-weight="300" fill="#eaf6ee" fill-opacity="0.85">Know what your models cost the planet.</text>
<text class="in d3" x="80" y="304" font-size="18" font-weight="300" fill="#8fb39d">Energy, CO₂ and spend for training runs and LLM calls.</text>
</g>
<g transform="translate(760,100)">
<g stroke="#eaf6ee" stroke-opacity="0.12"><path d="M0 200 H360"/><path d="M0 140 H360"/><path d="M0 80 H360"/><path d="M0 20 H360"/></g>
